# НЕ ГОТОВА
# для сервера/бд

services:
  server:
    build: ./server
    env_file: .env
    ports:
      -  # "8001:8000"
    depends_on:
      - db
    networks:
      - backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

  db:
    image: postgres:15
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend
    ports:
      -  # "5433:5432"
    restart: unless-stopped

volumes:
  pgdata:


networks:
  backend:
